apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatops-console
  namespace: chatops
  labels:
    app.kubernetes.io/name: chatops-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chatops-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatops-console
    spec:
      serviceAccountName: chatops-console
      containers:
        - name: chatops-console
          image: 178.128.86.110:30013/chatops-console:0.1.3
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: MODEL_PATH
              value: /app/models/qwen3-1.7b-instruct-q4_k_m.gguf
            - name: OUTPUTS_DIR
              value: /app/outputs
            - name: ALLOWED_NAMESPACES
              value: "default,kube-system"  # 필요에 따라 수정
            - name: LLM_THREADS
              value: "3"
            - name: LLM_CONTEXT_SIZE
              value: "2048"
            - name: LLM_MAX_TOKENS
              value: "512"
            - name: LLM_TIMEOUT
              value: "300"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
          volumeMounts:
            - name: model-volume
              mountPath: /app/models
            - name: outputs-volume
              mountPath: /app/outputs
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: model-volume
          persistentVolumeClaim:
            claimName: chatops-model-pvc
        - name: outputs-volume
          emptyDir: {}
